<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>اندوخته — مدیریت هوشمند مالی</title>
    <meta name="description" content="داشبورد مالی شخصی و کسب‌وکار: حساب‌ها، تراکنش‌ها، تحلیل و بودجه‌بندی." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#f4f6fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="اندوخته" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="اندوخته — مدیریت هوشمند مالی" />
    <meta property="og:description" content="حساب‌ها، تراکنش‌ها، تحلیل و بودجه‌بندی در یک داشبورد." />
    <meta property="og:locale" content="fa_IR" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <script>
      // اعمال تم پیش از رنگ‌آمیزی اولیه تا پرش رنگ رخ ندهد
      (function () {
        try {
          var saved = localStorage.getItem('andookhte:theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* اسپلش تا زمان بارگذاری باندل */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f4f6fc;
      }
      html.dark #boot { background: #05070f; }
      #boot span {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 3px solid rgba(51, 100, 255, 0.25);
        border-top-color: #3364ff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
