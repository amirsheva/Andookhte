# استقرار بدون کامپایل روی سرور.
#
#   docker compose -f docker-compose.prebuilt.yml up -d --build
#
# رمزها از فایل .env خوانده می‌شوند تا داخل این فایل — که در گیت است — نباشند.
# نمونه‌اش را از .env.example بردارید.

services:
  postgres:
    image: postgres:16
    container_name: andookhte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
    volumes:
      - andookhte-pgdata:/var/lib/postgresql/data
    # پورت دیتابیس عمداً به بیرون باز نمی‌شود؛ فقط کانتینر api به آن دسترسی دارد
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Andookhte.Api/Dockerfile.prebuilt
    container_name: andookhte-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./andookhte-web
      dockerfile: Dockerfile.prebuilt
    container_name: andookhte-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  andookhte-pgdata:
