server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # فشرده‌سازی — باندل جاوااسکریپت و CSS چند برابر کوچک‌تر تحویل می‌شود.
    # از nginx 1.21.1 نوع پیش‌فرض فایل‌های .js برابر text/javascript است؛
    # بدون آن، بزرگ‌ترین دارایی اپ اصلاً فشرده نمی‌شد.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml application/manifest+json;

    # دارایی‌های ساخته‌شده نام هش‌دار دارند، پس کش طولانی بی‌خطر است.
    # از expires استفاده نمی‌شود تا هدر Cache-Control دوباره صادر نشود.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include security-headers.conf;
        try_files $uri =404;
    }

    # سرویس‌ورکر هرگز کش نمی‌شود؛ در غیر این صورت نسخهٔ قدیمی اپ روی
    # دستگاه کاربر گیر می‌کند و به‌روزرسانی‌ها هرگز نمی‌رسند.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        include security-headers.conf;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # پراکسی به کانتینر بک‌اند روی شبکهٔ داخلی داکر. مسیر /api عمداً حذف نمی‌شود
    # چون روت‌های کنترلر هم با همان پیشوند api/ تعریف شده‌اند.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    # روتر از History API استفاده می‌کند، پس همهٔ مسیرها باید به index.html برسند
    location / {
        add_header Cache-Control "no-cache" always;
        include security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
