# در nginx، دستور add_header فقط وقتی از سطح والد ارث می‌رسد که سطح فعلی
# هیچ add_header نداشته باشد. چون همهٔ location‌ها هدر Cache-Control خودشان را
# دارند، هدرهای امنیتی سطح server در هیچ پاسخی ظاهر نمی‌شدند.
# راه‌حل: همین فایل در هر location جداگانه include می‌شود.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
